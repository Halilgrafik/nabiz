<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Nabız — dünya ve Türkiye teknoloji haberlerini tek yerden takip et, okuma alışkanlığını gör.">
    <title>{% block title %}Nabız{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="site-header">
        <a href="{% url 'article_list' %}" class="logo">Nabız</a>
        <nav>
            {% if user.is_authenticated %}
                <a href="{% url 'dashboard' %}">Panelim</a>
                <form method="post" action="{% url 'logout' %}" class="inline-form">
                    {% csrf_token %}
                    <button type="submit" class="link-button">Çıkış</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Giriş</a>
                <a href="{% url 'register' %}">Kayıt Ol</a>
            {% endif %}
        </nav>
    </header>

    <main>
        {% for message in messages %}
            <div class="message">{{ message }}</div>
        {% endfor %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
